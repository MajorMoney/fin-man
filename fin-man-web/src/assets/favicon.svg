<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Sapphire Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142a52" />
      <stop offset="50%" stop-color="#0c1a34" />
      <stop offset="100%" stop-color="#060e1d" />
    </linearGradient>

    <!-- Ambient Upper Glow -->
    <radialGradient id="ambientGlow" cx="48%" cy="20%" r="78%">
      <stop offset="0%" stop-color="#22549e" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#10254c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060e1d" />
    </radialGradient>

    <!-- Bar Gradients: Vibrant Electric Azure Blue -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ea3ff" />
      <stop offset="35%" stop-color="#2b82f8" />
      <stop offset="100%" stop-color="#1458d4" />
    </linearGradient>

    <linearGradient id="barGradSurge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6eb7ff" />
      <stop offset="35%" stop-color="#3b91fc" />
      <stop offset="100%" stop-color="#1a64e0" />
    </linearGradient>

    <!-- Crisp Drop Shadow -->
    <filter id="crispShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020817" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Container (Rounded App Icon) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#ambientGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#3b6fad" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- ==================== COLUMN BARS (Shifted Right & Down) ==================== -->
  <g id="bars">
    <!-- Bar 1 (Start) -->
    <rect x="146" y="328" width="48" height="114" rx="14" ry="14" fill="url(#barGrad)" />
    <!-- Bar 2 (Rise) -->
    <rect x="212" y="252" width="48" height="190" rx="14" ry="14" fill="url(#barGrad)" />
    <!-- Bar 3 (Dip / Stonks correction) -->
    <rect x="278" y="286" width="48" height="156" rx="14" ry="14" fill="url(#barGrad)" />
    <!-- Bar 4 (Breakout / Surge Peak) -->
    <rect x="344" y="194" width="48" height="248" rx="14" ry="14" fill="url(#barGradSurge)" />
  </g>

  <!-- ==================== MONOGRAM: F M € ==================== -->
  <g id="letters" filter="url(#crispShadow)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter F -->
    <path d="M 64 162 V 72 H 118 M 64 117 H 108" />

    <!-- Letter M -->
    <path d="M 140 162 V 72 L 178 122 L 216 72 V 162" />

    <!-- Redrawn Euro Sign € (Spaced cleanly to the right) -->
    <path d="M 330 84 C 308 64 270 64 252 88 C 234 112 234 122 252 146 C 270 170 308 170 330 150" />
    <path d="M 234 107 H 292" />
    <path d="M 234 127 H 292" />
  </g>

  <!-- ==================== STONKS SHARP ZIGZAG ARROW ==================== -->
  <g id="stonks-arrow" filter="url(#crispShadow)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sharp straight segments (Pure angular stock chart zigzag) -->
    <path d="M 64 344 
             L 128 258 
             L 176 308 
             L 248 238 
             L 292 282 
             L 346 242 
             L 456 64" />

    <!-- Clean, Balanced 90-degree Chevron Arrowhead (100% Mathematically Aligned to Shaft Angle of -58.28°) -->
    <path d="M 471.2 128.2 L 456.0 64.0 L 391.8 79.1" />
  </g>
</svg>
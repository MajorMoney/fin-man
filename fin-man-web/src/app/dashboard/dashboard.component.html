<div class="view">
  <app-incident-alert></app-incident-alert>

  <section class="now-band" aria-label="Now">
    <h2 class="dashboard-title">Now</h2>
    <app-cash-position></app-cash-position>
    <app-month-budget></app-month-budget>
    <app-upcoming></app-upcoming>
    <app-goal-pace></app-goal-pace>
  </section>

  <div class="dashboard-header">
    <h2 class="dashboard-title">This year</h2>
    <div class="chart-header">
      <span class="year-title">Year:</span>
      <select
        class="year-selector"
        [value]="selectedYear$ | async"
        (change)="onYearChange(+$any($event.target).value)"
      >
        @for (year of availableYears; track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </div>
  </div>

  <app-summary-grid [selectedYear$]="selectedYear$"></app-summary-grid>

  <div class="charts-container">
    <div class="charts-grid">
      <app-trend-chart [selectedYear$]="selectedYear$"></app-trend-chart>
      <app-category-chart [selectedYear$]="selectedYear$"></app-category-chart>
    </div>
  </div>

  <app-spending-by-account [selectedYear$]="selectedYear$"></app-spending-by-account>
</div>

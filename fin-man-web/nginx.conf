server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular client-side routes: serve index.html when the path is not a real file
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached; index.html should not
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The browser checks these on each visit to pick up a new version.
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
  }

  location = /ngsw.json {
    add_header Cache-Control "no-cache";
  }

  location = /safety-worker.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
}

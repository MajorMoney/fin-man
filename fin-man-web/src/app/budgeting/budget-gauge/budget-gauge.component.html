<section class="panel">
  <h3>Overall Progress</h3>
  <div class="gauge">
    <svg viewBox="0 0 120 72" aria-hidden="true">
      <path
        d="M15 62 A45 45 0 0 1 105 62"
        pathLength="100"
        fill="none"
        stroke="#e5e7eb"
        stroke-width="10"
        stroke-linecap="round"
      />
      <path
        d="M15 62 A45 45 0 0 1 105 62"
        pathLength="100"
        fill="none"
        [attr.stroke]="color"
        stroke-width="10"
        stroke-linecap="round"
        [attr.stroke-dasharray]="shown + ' 100'"
      />
    </svg>
    <div class="label">
      <strong>{{ percent }}%</strong>
      <span>of budget used</span>
    </div>
  </div>
  <div class="stats">
    <div>
      <span>Spent</span>
      <strong>{{ spent | currency: 'EUR' : 'symbol' : '1.0-0' }}</strong>
    </div>
    <div>
      <span>Budget</span>
      <strong>{{ budget | currency: 'EUR' : 'symbol' : '1.0-0' }}</strong>
    </div>
  </div>
</section>

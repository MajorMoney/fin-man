server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular client-side routes: serve index.html when the path is not a real file
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached; index.html should not
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}

@if (isOpen) {
  <div class="modal-overlay">
    <div class="modal-content" (click)="onContentClick($event)">
      <div class="modal-header">
        <h3>{{ editing ? 'Edit savings goal' : 'Add savings goal' }}</h3>
        <button class="close-btn" type="button" (click)="onClose()">×</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="goal-name">Name *</label>
          <input
            id="goal-name"
            type="text"
            class="form-input"
            [(ngModel)]="name"
          />
        </div>

        <div class="form-group">
          <label for="goal-description">Description</label>
          <textarea
            id="goal-description"
            class="form-input"
            rows="3"
            [(ngModel)]="description"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="goal-target-amount">Target amount (EUR) *</label>
          <input
            id="goal-target-amount"
            type="number"
            class="form-input"
            min="0.01"
            step="0.01"
            [(ngModel)]="targetAmount"
          />
        </div>

        <div class="form-group">
          <label for="goal-target-date">Target date *</label>
          <input
            id="goal-target-date"
            type="date"
            class="form-input"
            [min]="minDate"
            [(ngModel)]="targetDate"
          />
        </div>

        @if (!editing) {
          <div class="form-group">
            <label for="goal-saved-amount">Already saved (EUR)</label>
            <input
              id="goal-saved-amount"
              type="number"
              class="form-input"
              min="0"
              step="0.01"
              [(ngModel)]="savedAmount"
            />
            <p class="hint">
              Becomes the first virtual transaction. No account is changed.
            </p>
          </div>
        }
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" (click)="onClose()">
          Cancel
        </button>
        <button
          class="btn btn-primary"
          type="button"
          [disabled]="saving"
          (click)="onSave()"
        >
          {{ editing ? 'Save' : 'Add goal' }}
        </button>
      </div>
    </div>
  </div>
}

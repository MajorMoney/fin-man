@if (isOpen) {
  <div class="modal-overlay">
    <div class="modal-content" (click)="onContentClick($event)">
      <div class="modal-header">
        <h3>
          {{ editing ? 'Edit virtual transaction' : 'Add virtual transaction' }}
        </h3>
        <button class="close-btn" type="button" (click)="onClose()">×</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="virtual-amount">Amount (EUR) *</label>
          <input
            id="virtual-amount"
            type="number"
            class="form-input"
            min="0.01"
            step="0.01"
            [(ngModel)]="amount"
          />
        </div>

        <div class="form-group">
          <label for="virtual-date">Date *</label>
          <input
            id="virtual-date"
            type="date"
            class="form-input"
            [max]="maxDate"
            [(ngModel)]="date"
          />
        </div>

        <div class="form-group">
          <label for="virtual-note">Note</label>
          <textarea
            id="virtual-note"
            class="form-input"
            rows="3"
            [(ngModel)]="note"
          ></textarea>
          <p class="hint">
            Only tracks progress on this goal. It is not a transaction and no
            account balance changes.
          </p>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" (click)="onClose()">
          Cancel
        </button>
        <button
          class="btn btn-primary"
          type="button"
          [disabled]="saving"
          (click)="onSave()"
        >
          {{ editing ? 'Save' : 'Add' }}
        </button>
      </div>
    </div>
  </div>
}

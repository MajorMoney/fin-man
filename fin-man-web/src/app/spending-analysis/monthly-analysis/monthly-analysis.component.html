<div class="chart-card">
  <div class="card-header">
    <h2>Monthly analysis</h2>
    <div class="period-selector">
      @for (period of periods; track period) {
        <button
          [class.active]="selectedPeriod === period"
          (click)="onPeriodChange(period)"
        >
          {{ period }}
        </button>
      }
      <button class="compare-btn">⚖ Compare Periods</button>
    </div>
  </div>

  <div class="chart-area">
    <div class="y-axis">
      <span>$500</span>
      <span>$450</span>
      <span>$300</span>
      <span>$150</span>
      <span>$0</span>
    </div>

    <div class="chart-svg-container">
      <svg viewBox="0 0 600 200" preserveAspectRatio="none">
        <polyline
          [attr.points]="polylinePoints"
          fill="none"
          stroke="#4A90E2"
          stroke-width="2"
          vector-effect="non-scaling-stroke"
        />
        @for (point of chartData; track point.date; let i = $index) {
          <circle
            [attr.cx]="i * 100"
            [attr.cy]="getPointPosition(point.amount)"
            r="4"
            fill="#4A90E2"
            vector-effect="non-scaling-stroke"
          />
        }
      </svg>

      <div class="x-axis">
        @for (point of chartData; track point.date) {
          <span>{{ point.date }}</span>
        }
      </div>
    </div>
  </div>

  <div class="legend">
    <span class="legend-item">
      <span class="legend-dot"></span>
      Actual
    </span>
  </div>
</div>

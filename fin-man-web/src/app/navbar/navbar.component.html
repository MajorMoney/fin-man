<nav class="side-navbar">
  <ul>
    @for (item of navItems; track item.route ?? item.label) {
      <li>
        <a [routerLink]="item.route || '#'">
          @if (item.icon) {
            <span class="{{ item.icon }}"></span>
          }
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
